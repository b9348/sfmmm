<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>sfmmm</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 移动端诊断：JS 崩溃/未处理 Promise 拒绝直接渲染到屏幕，便于无 adb 排查白屏
      (function () {
        function showFatal(title, detail) {
          try {
            var root = document.getElementById('root')
            if (!root) return
            var pre = document.createElement('pre')
            pre.style.cssText =
              'position:fixed;inset:auto 0 0 0;max-height:60%;z-index:99999;overflow:auto;margin:0;padding:12px;' +
              'background:#1e1e1e;color:#ff6b6b;font-size:12px;white-space:pre-wrap;word-break:break-all;' +
              'border-top:1px solid #444;cursor:pointer;'
            pre.title = '点击关闭'
            pre.onclick = function () { pre.remove() }
            pre.textContent = '[FATAL] ' + title + '\n\n' + detail
            root.appendChild(pre)
          } catch (e) { /* ignore */ }
        }
        window.addEventListener('error', function (e) {
          showFatal(e.message, (e.error && e.error.stack) || e.filename + ':' + e.lineno)
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          showFatal('Unhandled rejection', (r && (r.stack || r.message)) || String(r))
        })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
