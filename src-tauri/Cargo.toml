[package]
name = "app"
version = "0.2.51"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# 运行时与构建脚本共用的依赖版本在这里统一声明，避免两处各写一份版本后漂移
[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }
aes-gcm = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = { version = "2", features = ["native-tls"] }
tauri-plugin-process = "2"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "multipart"] }
mysql = "25"
sha2 = { workspace = true }
hmac = "0.12"
hex = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
tokio = { version = "1", features = ["full"] }
sevenz-rust = "0.6"
futures-util = "0.3"
zip = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
lazy_static = "1"
once_cell = "1"
zeroize = "1"
chrono = "0.4"
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# dev 构建的 incremental 缓存是 target 体积的最大头：实测本项目一度累积 152 个会话、
# 21.2 GB（每次改动都会新开一个会话目录，旧会话不会自动回收），因此默认关闭。
# 代价是改动后重编译慢一些，需要时可用 CARGO_INCREMENTAL=1 临时开启。
# 历史遗留的 incremental 目录用 `pnpm clean:target --apply` 回收。
[profile.dev]
incremental = false
