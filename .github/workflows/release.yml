name: Build & Release

# 一次 tag 同时产出 Windows exe 与 Android arm64 APK。
# workflow_dispatch 默认只跑 preflight，用于发版前检查 Secrets / 版本 / 签名材料；
# 显式传 dry_run=false 才会构建，正式发版仍建议走 v* tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只执行预检，不构建、不发布'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version and tag
        id: version
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ANDROID_VERSION=$(node -p "require('./src-tauri/tauri.android.conf.json').version")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          JS_VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" src/version.js)
          TAG="v${VERSION}"

          echo "tauri.conf.json: $VERSION"
          echo "tauri.android.conf.json: $ANDROID_VERSION"
          echo "Cargo.toml: $CARGO_VERSION"
          echo "src/version.js: $JS_VERSION"
          if [ "$ANDROID_VERSION" != "$VERSION" ] || [ "$CARGO_VERSION" != "$VERSION" ] || [ "$JS_VERSION" != "$VERSION" ]; then
            echo "::error::Version files are out of sync; bump all of tauri.conf.json, tauri.android.conf.json, Cargo.toml and src/version.js"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match app version v$VERSION"
              exit 1
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${DRY_RUN:-false}" != "true" ]; then
            REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
            if [ -n "$REMOTE_TAG_SHA" ]; then
              if [ "$REMOTE_TAG_SHA" != "$(git rev-parse HEAD)" ]; then
                echo "::error::Tag $TAG already exists on another commit; bump the version before dispatching a real build"
                exit 1
              fi
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        shell: bash
        env:
          SFMMM_PUBLIC_BASE_URL: ${{ secrets.SFMMM_PUBLIC_BASE_URL }}
          SFMMM_API_BASE: ${{ secrets.SFMMM_API_BASE }}
          DESKTOP_XPORT_KEY: ${{ secrets.DESKTOP_XPORT_KEY }}
          IMGBED_URL: ${{ secrets.IMGBED_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SFMMM_ADMIN_TOKEN: ${{ secrets.SFMMM_ADMIN_TOKEN }}
          VITE_LANZOU_BEPINEX: ${{ secrets.VITE_LANZOU_BEPINEX }}
          VITE_LANZOU_V2: ${{ secrets.VITE_LANZOU_V2 }}
          VITE_LANZOU_FONT: ${{ secrets.VITE_LANZOU_FONT }}
          VITE_LANZOU_RMMOSAIC: ${{ secrets.VITE_LANZOU_RMMOSAIC }}
          VITE_QUARK_URL: ${{ secrets.VITE_QUARK_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          require_secret() {
            local name="$1"
            local value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          }
          for name in \
            SFMMM_PUBLIC_BASE_URL DESKTOP_XPORT_KEY IMGBED_URL \
            R2_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
            SFMMM_ADMIN_TOKEN \
            VITE_LANZOU_BEPINEX VITE_LANZOU_V2 VITE_LANZOU_FONT VITE_LANZOU_RMMOSAIC \
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            require_secret "$name"
          done
          if [ -z "$VITE_QUARK_URL" ]; then
            echo "::warning::VITE_QUARK_URL is empty; the Quark download entry will be hidden"
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Java for keystore check
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/preflight.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          test -s "$KS"
          keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Android keystore and alias are readable"

      - name: Check endpoints reachability
        shell: bash
        env:
          SFMMM_PUBLIC_BASE_URL: ${{ secrets.SFMMM_PUBLIC_BASE_URL }}
          IMGBED_URL: ${{ secrets.IMGBED_URL }}
        run: |
          set -euo pipefail
          for value in "$SFMMM_PUBLIC_BASE_URL" "$IMGBED_URL"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$value" || true)
            if [ "$code" = "000" ]; then
              echo "::error::Endpoint is unreachable (DNS/TLS/connection failed)"
              exit 1
            fi
            echo "Endpoint reachable: HTTP $code"
          done

  build-desktop:
    name: Build Windows NSIS
    needs: [preflight]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Create .env
        shell: bash
        env:
          SFMMM_PUBLIC_BASE_URL: ${{ secrets.SFMMM_PUBLIC_BASE_URL }}
          SFMMM_API_BASE: ${{ secrets.SFMMM_API_BASE }}
          DESKTOP_XPORT_KEY: ${{ secrets.DESKTOP_XPORT_KEY }}
          IMGBED_URL: ${{ secrets.IMGBED_URL }}
          VITE_LANZOU_BEPINEX: ${{ secrets.VITE_LANZOU_BEPINEX }}
          VITE_LANZOU_V2: ${{ secrets.VITE_LANZOU_V2 }}
          VITE_LANZOU_FONT: ${{ secrets.VITE_LANZOU_FONT }}
          VITE_LANZOU_RMMOSAIC: ${{ secrets.VITE_LANZOU_RMMOSAIC }}
          VITE_QUARK_URL: ${{ secrets.VITE_QUARK_URL }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PUBLIC_BASE="${SFMMM_PUBLIC_BASE_URL%/}"
          API_BASE="${SFMMM_API_BASE:-}"
          if [ -z "$API_BASE" ]; then API_BASE="${PUBLIC_BASE}/api/user"; fi
          API_BASE="${API_BASE%/}"
          IMGBED="${IMGBED_URL%/}"
          {
            printf 'SFMMM_API_BASE=%s\n' "$API_BASE"
            printf 'DESKTOP_XPORT_KEY=%s\n' "$DESKTOP_XPORT_KEY"
            printf 'IMGBED_URL=%s\n' "$IMGBED"
            printf 'GITHUB_REPO=%s\n' "$GITHUB_REPO"
          } > src-tauri/.env
          {
            printf 'VITE_LATEST_URL=%s\n' "${IMGBED}/file/sfm/installer/latest.json"
            printf 'VITE_IMGBED_URL=%s\n' "$IMGBED"
            printf 'VITE_LANZOU_BEPINEX=%s\n' "$VITE_LANZOU_BEPINEX"
            printf 'VITE_LANZOU_V2=%s\n' "$VITE_LANZOU_V2"
            printf 'VITE_LANZOU_FONT=%s\n' "$VITE_LANZOU_FONT"
            printf 'VITE_LANZOU_RMMOSAIC=%s\n' "$VITE_LANZOU_RMMOSAIC"
            printf 'VITE_QUARK_URL=%s\n' "$VITE_QUARK_URL"
            printf 'VITE_GITHUB_REPO=%s\n' "$GITHUB_REPO"
          } > .env

      - name: Remove local Cargo config for CI
        run: rm -f src-tauri/.cargo/config.toml
        shell: bash

      - name: Build Tauri (NSIS)
        run: pnpm tauri build
        shell: bash
        env:
          HTTPS_PROXY: ''
          HTTP_PROXY: ''

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v7
        with:
          name: nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Build Android APK (arm64)
    needs: [preflight]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply version to Android config
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p='src-tauri/tauri.android.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMGR"
          echo "Using sdkmanager: $SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

      - name: Setup Android NDK
        shell: bash
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          NDK_VER=$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_VER" ]; then
            echo "No preinstalled NDK found, installing pinned version..."
            sdkmanager --install "ndk;27.2.12479018"
            NDK_VER=27.2.12479018
          fi
          NDK_HOME="$ANDROID_HOME/ndk/$NDK_VER"
          test -f "$NDK_HOME/source.properties"
          echo "Using NDK $NDK_VER at $NDK_HOME"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Setup Rust (nightly + Android target)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: 'aarch64-linux-android'

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Create .env
        shell: bash
        env:
          SFMMM_PUBLIC_BASE_URL: ${{ secrets.SFMMM_PUBLIC_BASE_URL }}
          SFMMM_API_BASE: ${{ secrets.SFMMM_API_BASE }}
          DESKTOP_XPORT_KEY: ${{ secrets.DESKTOP_XPORT_KEY }}
          IMGBED_URL: ${{ secrets.IMGBED_URL }}
          VITE_LANZOU_BEPINEX: ${{ secrets.VITE_LANZOU_BEPINEX }}
          VITE_LANZOU_V2: ${{ secrets.VITE_LANZOU_V2 }}
          VITE_LANZOU_FONT: ${{ secrets.VITE_LANZOU_FONT }}
          VITE_LANZOU_RMMOSAIC: ${{ secrets.VITE_LANZOU_RMMOSAIC }}
          VITE_QUARK_URL: ${{ secrets.VITE_QUARK_URL }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PUBLIC_BASE="${SFMMM_PUBLIC_BASE_URL%/}"
          API_BASE="${SFMMM_API_BASE:-}"
          if [ -z "$API_BASE" ]; then API_BASE="${PUBLIC_BASE}/api/user"; fi
          API_BASE="${API_BASE%/}"
          IMGBED="${IMGBED_URL%/}"
          {
            printf 'SFMMM_API_BASE=%s\n' "$API_BASE"
            printf 'DESKTOP_XPORT_KEY=%s\n' "$DESKTOP_XPORT_KEY"
            printf 'IMGBED_URL=%s\n' "$IMGBED"
            printf 'GITHUB_REPO=%s\n' "$GITHUB_REPO"
          } > src-tauri/.env
          {
            printf 'VITE_LATEST_URL=%s\n' "${IMGBED}/file/sfm/installer/latest.json"
            printf 'VITE_IMGBED_URL=%s\n' "$IMGBED"
            printf 'VITE_LANZOU_BEPINEX=%s\n' "$VITE_LANZOU_BEPINEX"
            printf 'VITE_LANZOU_V2=%s\n' "$VITE_LANZOU_V2"
            printf 'VITE_LANZOU_FONT=%s\n' "$VITE_LANZOU_FONT"
            printf 'VITE_LANZOU_RMMOSAIC=%s\n' "$VITE_LANZOU_RMMOSAIC"
            printf 'VITE_QUARK_URL=%s\n' "$VITE_QUARK_URL"
            printf 'VITE_GITHUB_REPO=%s\n' "$GITHUB_REPO"
          } > .env

      - name: Remove local Cargo config for CI
        run: rm -f src-tauri/.cargo/config.toml
        shell: bash

      - name: Switch to Android config
        run: cp src-tauri/tauri.android.conf.json src-tauri/tauri.conf.json
        shell: bash

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Init Tauri Android (if needed)
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init
          else
            echo "Android project already initialized"
          fi

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/sfm-release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "使用仓库 Secrets 中的签名 keystore"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "TAURI_ANDROID_KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
            echo "TAURI_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TAURI_ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，使用临时调试钥匙（每次构建签名不同，安装前需卸载旧版）"
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=SFM,C=US"
            echo "TAURI_ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "TAURI_ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "TAURI_ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          test -s "$KS"
          echo "TAURI_ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64
        shell: bash

      - name: Collect & sign APKs
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          KS="$TAURI_ANDROID_KEYSTORE_PATH"
          OUT="src-tauri/target/release/apk"
          PRODUCT=$(node -p "require('./src-tauri/tauri.android.conf.json').productName")
          PRODUCT=$(echo "$PRODUCT" | tr ' ' '-')
          rm -rf "$OUT"
          mkdir -p "$OUT"
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | while read -r APK; do
            ABIS=$(unzip -l "$APK" | awk -F'lib/' '/lib\//{print $2}' | cut -d/ -f1 | sort -u | tr '\n' ' ')
            case "$ABIS" in
              "arm64-v8a ") ABI=arm64 ;;
              "armeabi-v7a ") ABI=armv7 ;;
              "x86_64 ") ABI=x86_64 ;;
              "x86 ") ABI=x86 ;;
              *) ABI=universal ;;
            esac
            NAME="${PRODUCT}-v${VERSION}-android-${ABI}"
            ALIGNED="$RUNNER_TEMP/${NAME}-aligned.apk"
            SIGNED="$OUT/${NAME}.apk"
            if [[ "$APK" == *-unsigned.apk ]]; then
              echo "Aligning & signing: $APK"
              "$BT/zipalign" -f -p 4 "$APK" "$ALIGNED"
              "$BT/apksigner" sign --ks "$KS" --ks-pass pass:"$TAURI_ANDROID_KEYSTORE_PASSWORD" \
                --key-pass pass:"$TAURI_ANDROID_KEY_PASSWORD" --ks-key-alias "$TAURI_ANDROID_KEY_ALIAS" \
                --out "$SIGNED" "$ALIGNED"
            else
              echo "Copying already-signed: $APK"
              cp -f "$APK" "$SIGNED"
            fi
            "$BT/apksigner" verify --print-certs "$SIGNED"
          done
          ls -la "$OUT"
          test -n "$(find "$OUT" -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: sfmmm-android-v${{ needs.preflight.outputs.version }}
          path: src-tauri/target/release/apk/*.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Release
    needs: [preflight, build-desktop, build-android]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: nsis-installer
          path: dist/desktop

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: sfmmm-android-v${{ needs.preflight.outputs.version }}
          path: dist/android

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag_name }}
          name: ${{ needs.preflight.outputs.tag_name }}
          body: |
            ## ${{ needs.preflight.outputs.tag_name }}

            Windows 安装包与 Android arm64 APK 一次构建完成。
          files: |
            dist/desktop/*.exe
            dist/android/*.apk
          generate_release_notes: true

      - name: Upload to R2 & Update Cloud Version
        shell: bash
        env:
          NEW_VERSION: ${{ needs.preflight.outputs.version }}
          IMGBED_URL: ${{ secrets.IMGBED_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PUBLIC_BASE: ${{ secrets.SFMMM_PUBLIC_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.SFMMM_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::Upload to R2"
          DOWNLOAD_URL=$(node scripts/release-upload-r2.mjs dist/desktop)
          echo "Download URL: $DOWNLOAD_URL"
          echo "::endgroup::"

          echo "::group::Update version_config via API"
          BASE="${PUBLIC_BASE%/}"
          if [ -z "$BASE" ]; then
            echo "::error::Missing SFMMM_PUBLIC_BASE_URL secret"
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /tmp/admin_resp.json -w '%{http_code}' -X POST \
            "${BASE}/api/user/rpc/admin_set_version" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            --data "{\"version\":\"${NEW_VERSION}\",\"update_url\":\"${DOWNLOAD_URL}\"}")
          cat /tmp/admin_resp.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to update version_config (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "Cloud version config updated to v${NEW_VERSION}"
          echo "::endgroup::"

      - name: Clean old Actions artifacts
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let deleted = 0;
            for (const artifact of artifacts) {
              if (artifact.workflow_run?.id === context.runId) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              deleted += 1;
            }
            core.info(`Deleted ${deleted} old Actions artifacts`);
