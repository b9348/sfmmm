name: Build & Release

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VERSION"

      - name: Create tag if not exists
        shell: bash
        run: |
          TAG="${{ steps.get_version.outputs.tag_name }}"
          # 直接检查远端标签，避免浅克隆下本地 git rev-parse 查不到已存在的 tag
          if ! git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag: $TAG"
          else
            echo "Tag $TAG already exists"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 需与 pnpm-lock.yaml 的 lockfileVersion 9.0 匹配（pnpm 8 不识别会忽略锁文件导致依赖漂移）
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Create .env
        run: |
          # hk 架构：桌面端不再需要 DB_URL / DB_ENC_KEY（全部在服务端）
          # API 基址 / 分发域名均来自仓库配置，不写死在仓库里
          PUBLIC_BASE="${{ vars.SFMMM_PUBLIC_BASE_URL }}"
          if [ -z "$PUBLIC_BASE" ]; then
            echo "::error::Missing repo variable SFMMM_PUBLIC_BASE_URL (e.g. https://api.example.com)"
            exit 1
          fi
          API_BASE="${{ vars.SFMMM_API_BASE }}"
          if [ -z "$API_BASE" ]; then API_BASE="${PUBLIC_BASE%/}/api/user"; fi
          echo "SFMMM_API_BASE=${API_BASE%/}" > src-tauri/.env
          echo "DESKTOP_XPORT_KEY=${{ secrets.DESKTOP_XPORT_KEY }}" >> src-tauri/.env
          echo "IMGBED_URL=${{ secrets.IMGBED_URL }}" >> src-tauri/.env
          echo "GITHUB_REPO=${{ github.repository }}" >> src-tauri/.env
          echo "VITE_LATEST_URL=${{ secrets.IMGBED_URL }}/file/sfm/installer/latest.json" > .env
          echo "VITE_IMGBED_URL=${{ secrets.IMGBED_URL }}" >> .env
          echo "VITE_LANZOU_BEPINEX=${{ vars.VITE_LANZOU_BEPINEX }}" >> .env
          echo "VITE_LANZOU_V2=${{ vars.VITE_LANZOU_V2 }}" >> .env
          echo "VITE_LANZOU_FONT=${{ vars.VITE_LANZOU_FONT }}" >> .env
          echo "VITE_LANZOU_RMMOSAIC=${{ vars.VITE_LANZOU_RMMOSAIC }}" >> .env
          echo "VITE_QUARK_URL=${{ vars.VITE_QUARK_URL }}" >> .env
          echo "VITE_GITHUB_REPO=${{ github.repository }}" >> .env
        shell: bash

      - name: Warn on missing optional vars
        if: ${{ vars.VITE_QUARK_URL == '' }}
        run: echo "::warning::VITE_QUARK_URL 未配置，安装包将隐藏夸克网盘下载入口"
        shell: bash

      - name: Remove local Cargo config for CI
        run: rm -f src-tauri/.cargo/config.toml
        shell: bash

      - name: Build Tauri (NSIS)
        run: pnpm tauri build
        env:
          HTTPS_PROXY: ''
          HTTP_PROXY: ''

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v7
        with:
          name: nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Create Release & Update Cloud
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: nsis-installer

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: ${{ needs.build.outputs.tag_name }}
          body: |
            ## ${{ needs.build.outputs.tag_name }}

            自动构建安装包，下载后运行即可更新。
          files: |
            *.exe
          generate_release_notes: true

      - name: Upload to ImgBed & Update Cloud Version
        shell: bash
        run: |
          EXE_FILE=$(ls *.exe | head -1)
          if [ -z "$EXE_FILE" ]; then
            echo "::error::No .exe installer found in workspace"
            exit 1
          fi
          echo "Found installer: $EXE_FILE"

          NEW_VERSION="${{ needs.build.outputs.version }}"
          IMGBED_URL="${{ secrets.IMGBED_URL }}"

          # 1. 上传安装包到 ImgBed（图床 CDN）
          echo "::group::Upload to ImgBed"
          UPLOAD_RESP=$(curl -s -X POST \
            "${IMGBED_URL}/upload?uploadChannel=telegram&uploadFolder=sfm/installer/v${NEW_VERSION}&returnFormat=full" \
            -H "Authorization: Bearer ${{ secrets.IMGBED_TOKEN }}" \
            -F "file=@${EXE_FILE}")
          echo "ImgBed response: $UPLOAD_RESP"
          echo "::endgroup::"

          DOWNLOAD_URL=$(echo "$UPLOAD_RESP" | jq -r '.[0].src // empty')
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Failed to upload to ImgBed"
            echo "$UPLOAD_RESP"
            exit 1
          fi
          echo "Download URL: $DOWNLOAD_URL"

          # 2. 更新固定路径的版本清单 latest.json（先删旧再传新，uploadNameType=origin 保证 URL 固定）
          echo "::group::Update latest.json manifest"
          LATEST_URL="${IMGBED_URL}/file/sfm/installer/latest.json"

          echo "Deleting old manifest (if any)..."
          curl -s -X GET \
            "${IMGBED_URL}/api/manage/delete/sfm/installer/latest.json" \
            -H "Authorization: Bearer ${{ secrets.IMGBED_TOKEN }}" || true

          echo "{\"version\":\"${NEW_VERSION}\",\"update_url\":\"${DOWNLOAD_URL}\"}" > latest.json
          MANIFEST_RESP=$(curl -s -X POST \
            "${IMGBED_URL}/upload?uploadChannel=telegram&uploadFolder=sfm/installer&returnFormat=full&uploadNameType=origin" \
            -H "Authorization: Bearer ${{ secrets.IMGBED_TOKEN }}" \
            -F "file=@latest.json")
          echo "Manifest upload response: $MANIFEST_RESP"
          MANIFEST_SRC=$(echo "$MANIFEST_RESP" | jq -r '.[0].src // empty')
          if [ -z "$MANIFEST_SRC" ]; then
            echo "::error::Failed to upload latest.json to ImgBed"
            echo "$MANIFEST_RESP"
            exit 1
          fi
          echo "✅ Manifest available at: $LATEST_URL"
          echo "::endgroup::"

          # 3. 通过服务端管理接口更新 version_config（不再直连 MySQL）
          echo "::group::Update version_config via API"
          BASE="${{ vars.SFMMM_PUBLIC_BASE_URL }}"
          if [ -z "$BASE" ]; then
            echo "::error::Missing repo variable SFMMM_PUBLIC_BASE_URL (e.g. https://api.example.com)"
            exit 1
          fi
          if [ -z "${{ secrets.SFMMM_ADMIN_TOKEN }}" ]; then
            echo "::error::Missing SFMMM_ADMIN_TOKEN secret"
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /tmp/admin_resp.json -w '%{http_code}' -X POST \
            "${BASE%/}/api/user/rpc/admin_set_version" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${{ secrets.SFMMM_ADMIN_TOKEN }}" \
            --data "{\"version\":\"${NEW_VERSION}\",\"update_url\":\"${DOWNLOAD_URL}\"}")
          cat /tmp/admin_resp.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to update version_config (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "✅ Cloud version config updated to v${NEW_VERSION} — ${DOWNLOAD_URL}"
          echo "::endgroup::"
