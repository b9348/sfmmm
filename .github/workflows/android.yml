name: Build Android APK

on:
  push:
    branches: [feat/mobile-discussion]
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version_override:
        description: '版本号（留空则使用 tauri.conf.json 中的版本）'
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    env:
      DB_URL: ${{ secrets.DB_URL }}
      IMGBED_URL: ${{ secrets.IMGBED_URL }}
      IMGBED_TOKEN: ${{ secrets.IMGBED_TOKEN }}
      DB_ENC_KEY: ${{ secrets.DB_ENC_KEY }}
      VITE_LATEST_URL: ${{ secrets.IMGBED_URL }}/file/sfm/installer/latest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/android-v}"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=android-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: android-v$VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Android NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          NDK_VER=$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_VER" ]; then
            echo "No preinstalled NDK found, installing pinned version..."
            sdkmanager --install "ndk;27.2.12479018"
            NDK_VER=27.2.12479018
          fi
          NDK_HOME="$ANDROID_HOME/ndk/$NDK_VER"
          test -f "$NDK_HOME/source.properties"
          echo "Using NDK $NDK_VER at $NDK_HOME"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Create .env
        run: |
          echo "DB_URL=${{ secrets.DB_URL }}" > src-tauri/.env
          echo "IMGBED_URL=${{ secrets.IMGBED_URL }}" >> src-tauri/.env
          echo "IMGBED_TOKEN=${{ secrets.IMGBED_TOKEN }}" >> src-tauri/.env
          echo "DB_ENC_KEY=${{ secrets.DB_ENC_KEY }}" >> src-tauri/.env
          echo "VITE_LATEST_URL=${{ secrets.IMGBED_URL }}/file/sfm/installer/latest.json" > .env
        shell: bash

      - name: Remove local Cargo config for CI
        run: rm -f src-tauri/.cargo/config.toml
        shell: bash

      - name: Switch to Android config
        run: cp src-tauri/tauri.android.conf.json src-tauri/tauri.conf.json
        shell: bash

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Init Tauri Android (if needed)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init
          else
            echo "Android project already initialized"
          fi
        shell: bash

      - name: Prepare signing keystore
        run: |
          KS="$RUNNER_TEMP/sfm-debug.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=SFM,C=US"
          fi
          {
            echo "TAURI_ANDROID_KEYSTORE_PATH=$KS"
            echo "TAURI_ANDROID_KEYSTORE_PASSWORD=android"
            echo "TAURI_ANDROID_KEY_ALIAS=androiddebugkey"
          } >> "$GITHUB_ENV"
        shell: bash

      - name: Build APK
        run: pnpm tauri android build --apk
        shell: bash

      - name: Collect & sign APKs
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          KS="$TAURI_ANDROID_KEYSTORE_PATH"
          OUT="src-tauri/target/release/apk"
          mkdir -p "$OUT"
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | while read -r APK; do
            NAME="$(basename "$APK" .apk)"
            NAME="${NAME%-unsigned}"
            ALIGNED="$RUNNER_TEMP/${NAME}-aligned.apk"
            SIGNED="$OUT/${NAME}.apk"
            if [[ "$APK" == *-unsigned.apk ]]; then
              echo "Aligning & signing: $APK"
              "$BT/zipalign" -f -p 4 "$APK" "$ALIGNED"
              "$BT/apksigner" sign --ks "$KS" --ks-pass pass:"$TAURI_ANDROID_KEYSTORE_PASSWORD" \
                --key-pass pass:"$TAURI_ANDROID_KEYSTORE_PASSWORD" --ks-key-alias "$TAURI_ANDROID_KEY_ALIAS" \
                --out "$SIGNED" "$ALIGNED"
            else
              echo "Copying already-signed: $APK"
              cp -f "$APK" "$SIGNED"
            fi
            "$BT/apksigner" verify --print-certs "$SIGNED" || true
          done
          ls -la "$OUT"
          test -n "$(find "$OUT" -name '*.apk' -print -quit)"
        shell: bash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ steps.get_version.outputs.version }}
          path: src-tauri/target/release/apk/*.apk
          if-no-files-found: error

      - name: Upload to ImgBed (on android tag)
        if: startsWith(github.ref, 'refs/tags/android-v')
        shell: bash
        run: |
          APK_FILE=$(find src-tauri/target/release/apk -name "*.apk" -print -quit)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          
          NEW_VERSION="${{ steps.get_version.outputs.version }}"
          IMGBED_URL="${{ secrets.IMGBED_URL }}"
          
          echo "::group::Upload APK to ImgBed"
          UPLOAD_RESP=$(curl -s -X POST \
            "${IMGBED_URL}/upload?uploadChannel=telegram&uploadFolder=sfm/android/v${NEW_VERSION}&returnFormat=full" \
            -H "Authorization: Bearer ${{ secrets.IMGBED_TOKEN }}" \
            -F "file=@${APK_FILE}")
          echo "ImgBed response: $UPLOAD_RESP"
          echo "::endgroup::"
          
          echo "$UPLOAD_RESP" | jq -r '.[0].src // empty'

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Android ${{ steps.get_version.outputs.tag_name }}
          body: |
            ## Android APK ${{ steps.get_version.outputs.tag_name }}

            自动构建的 Android 安装包。
            
            **注意**：此版本仅支持登录，注册请在 PC 端完成。
          files: |
            src-tauri/target/release/apk/*.apk
          generate_release_notes: true
